<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Full news story from the Odisha State Population-Based Cancer Registry.">
    <title>OSPBCR | News</title>

    <link href="lib/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css?v=20260801-site-80-percent">
    <link rel="stylesheet" href="assets/css/design-system.css?v=20260802-navbar-plus-3px">
    <link rel="stylesheet" href="assets/css/pages/trending.css?v=20260908-download-dialog-modern">
    <link rel="stylesheet" href="assets/css/pages/news-detail.css?v=20260817-centered-news-v2">
</head>

<body class="news-detail-page">
    <div id="navbar-container"></div>

    <main>
        <section class="news-detail-section" aria-labelledby="news-detail-heading">
            <div class="container-custom">
                <a class="news-detail-back" data-news-back href="trending.html?dateOrder=desc">
                    <span aria-hidden="true">&larr;</span>
                    <span data-news-back-label>Back to Trending News</span>
                </a>

                <header class="news-detail-heading">
                    <span class="trending-kicker" data-news-kicker>Trending News</span>
                    <h1 id="news-detail-heading" data-news-heading>Full News Story</h1>
                </header>

                <div class="trending-status news-detail-status" data-news-status role="status" aria-live="polite">
                    Loading news story&hellip;
                </div>
                <div class="news-detail-content" data-news-content aria-live="polite"></div>
            </div>
        </section>
    </main>

    <dialog class="news-download-dialog" data-news-download-dialog aria-labelledby="news-download-heading">
        <form method="dialog" class="news-download-dialog-card">
            <button class="news-download-close" type="submit" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
            <div class="news-download-dialog-heading">
                <span class="news-download-dialog-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false">
                        <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" />
                    </svg>
                </span>
                <div>
                    <span class="trending-kicker" data-download-kicker>Download News Card</span>
                    <h2 id="news-download-heading" data-download-heading>Choose a language</h2>
                </div>
            </div>
            <div class="news-download-story">
                <span class="news-download-story-mark" aria-hidden="true">N</span>
                <p data-news-download-title></p>
            </div>
            <div class="news-download-language-options" role="group" aria-labelledby="news-download-heading">
                <button type="button" data-download-language="en">
                    <span class="news-download-language-code" aria-hidden="true">EN</span>
                    <span>English</span>
                    <span class="news-download-language-arrow" aria-hidden="true">&darr;</span>
                </button>
                <button type="button" data-download-language="hi" lang="hi">
                    <span class="news-download-language-code" aria-hidden="true">हि</span>
                    <span>हिन्दी</span>
                    <span class="news-download-language-arrow" aria-hidden="true">&darr;</span>
                </button>
                <button type="button" data-download-language="or" lang="or">
                    <span class="news-download-language-code" aria-hidden="true">ଓ</span>
                    <span>ଓଡ଼ିଆ</span>
                    <span class="news-download-language-arrow" aria-hidden="true">&darr;</span>
                </button>
            </div>
            <div class="news-download-help">
                <span aria-hidden="true">i</span>
                <small data-download-help>The ZIP includes the styled story, every photo, and its attachment folders.</small>
            </div>
        </form>
    </dialog>

    <div id="footer-container"></div>

    <script src="assets/js/core/i18n.js?v=20260831-translation-audit"></script>
    <script src="assets/js/core/loader.js?v=20260817-news-detail-page"></script>
    <script src="assets/js/pages/news-detail.js?v=20260909-preserve-news-language"></script>
</body>

</html>
